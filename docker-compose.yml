services:
  cart:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.cart
    container_name: cart
    ports:
      - "3000:3000"
    volumes:
      - .:/cart
      - /cart/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/test
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  catalog:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.catalog
    container_name: catalog
    ports:
      - "3001:3001"
    volumes:
      - .:/cart
      - /cart/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgres://postgres:postgres@db:5432/test
    depends_on:
      cart:
        condition: service_started
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  db:
    image: postgres:17-alpine
    container_name: postgress_app
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=16MB
      -c work_mem=2MB
      -c maintenance_work_mem=16MB
      -c max_connections=20
      -c autovacuum=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
