services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: black_friday_shop_app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/black_friday_shop_db
    command: npm run dev
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  db:
    image: postgres:17-alpine
    container_name: black_friday_shop_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: black_friday_shop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Otimização extrema de memória para Macbooks com pouca RAM livre (~50-100MB RAM)
    command: >
      postgres
      -c shared_buffers=16MB
      -c work_mem=2MB
      -c maintenance_work_mem=16MB
      -c max_connections=20
      -c autovacuum=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
